apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser-user
  namespace: filebrowser
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: filebrowser-user
    creationPolicy: Owner
  data:
  - secretKey: filebrowser-username
    remoteRef:
      key: secrets-v2/data/filebrowser
      property: username
      conversionStrategy: Default #argo sync issue
      decodingStrategy: None #argo sync issue
      metadataPolicy: None #argo sync issue
  - secretKey: filebrowser-password
    remoteRef:
      key: secrets-v2/data/filebrowser
      property: password
      conversionStrategy: Default #argo sync issue
      decodingStrategy: None #argo sync issue
      metadataPolicy: None #argo sync issue
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser-oidc
  namespace: filebrowser
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: filebrowser-oidc
    creationPolicy: Owner
  data:
  - secretKey: filebrowser-clientid
    remoteRef:
      key: secrets-v2/data/filebrowser-oidc
      property: clientid
      conversionStrategy: Default #argo sync issue
      decodingStrategy: None #argo sync issue
      metadataPolicy: None #argo sync issue
  - secretKey: filebrowser-clientsecret
    remoteRef:
      key: secrets-v2/data/filebrowser-oidc
      property: clientsecret
      conversionStrategy: Default #argo sync issue
      decodingStrategy: None #argo sync issue
      metadataPolicy: None #argo sync issue
