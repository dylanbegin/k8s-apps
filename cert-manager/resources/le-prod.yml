apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: le-prod
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: le-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api
              key: cloudflare-api-key
        selector:
          dnsZones:
            - "cryogence.io"
