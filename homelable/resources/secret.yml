apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelable
  namespace: homelable
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homelable
    creationPolicy: Owner
  data:
  - secretKey: homelable-secret-key
    remoteRef:
      key: secrets-v2/data/homelable
      property: secret-key
      conversionStrategy: Default #argo sync issue
      decodingStrategy: None #argo sync issue
      metadataPolicy: None #argo sync issue
