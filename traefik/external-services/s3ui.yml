apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-s3ui-io
  namespace: traefik
spec:
  secretName: cert-s3ui-io
  issuerRef:
    name: le-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 384
  commonName: "s3ui.cryogence.io"
  dnsNames:
  - "s3ui.cryogence.io"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headers-s3ui
  namespace: traefik
spec:
  headers:
    # prevent MIME-type sniffing
    contentTypeNosniff: true
    # clickjacking protection
    frameDeny: true
    contentSecurityPolicy: >-
      base-uri 'self';
      connect-src 'self';
      font-src 'self';
      form-action 'self';
      frame-ancestors 'none';
      frame-src 'none';
      img-src 'self' data:;
      manifest-src 'self';
      media-src 'self';
      object-src 'none';
      worker-src 'self';
      upgrade-insecure-requests
    # restrict browser features
    # set to (self) as needed.
    permissionsPolicy: >-
      accelerometer=(),
      bluetooth=(),
      camera=(),
      geolocation=(),
      gyroscope=(),
      interest-cohort=(),
      magnetometer=(),
      microphone=(),
      midi=(),
      payment=(),
      picture-in-picture=(),
      publickey-credentials-get=(),
      screen-wake-lock=(),
      serial=(),
      usb=(),
      vr=()
    # dont leak url paths to other origins
    referrerPolicy: strict-origin-when-cross-origin
    # hsts configs
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    # block bots
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow, noarchive, nosnippet, notranslate, noimageindex"
      Cross-Origin-Opener-Policy: "same-origin"
      Cross-Origin-Resource-Policy: "same-site"
---
apiVersion: v1
kind: Service
metadata:
  name: s3ui
  namespace: traefik
spec:
  externalName: nas.cryogence.org
  type: ExternalName
  ports:
  - name: websecure
    port: 30293
    targetPort: 30293
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: s3ui-webui
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`s3ui.cryogence.io`)
      services:
        - name: s3ui
          port: 30293
          passHostHeader: true
          scheme: https
      middlewares:
        - name: headers-s3ui
          namespace: traefik
  tls:
    secretName: cert-s3ui-io
