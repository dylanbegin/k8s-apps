global:
  checkNewVersion: false
  sendAnonymousUsage: false
additionalArguments:
  - --serversTransport.insecureSkipVerify=true
deployment:
  enabled: true
  replicas: 2
gateway:
  enabled: false
gatewayClass:
  enabled: false
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    http3:
      enabled: true
      advertisedPort: 4443
    http:
      tls:
        enabled: true
#tlsoption currently does not apply to authentik outpost.
#throws traefik warnings and falls back to default option.
#tlsOptions:
#  tls13only:
#    labels: {}
#    minVersion: VersionTLS13
#    sniStrict: true
ingressRoute:
  dashboard:
    enabled: false
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true #req for authentik
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
    allowExternalNameServices: true
log:
  level: INFO
rbac:
  enabled: true
service:
  enabled: true
  type: LoadBalancer
  annotations: {"io.cilium/lb-ipam-ips": "10.10.10.100"}
