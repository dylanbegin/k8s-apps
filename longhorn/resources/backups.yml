apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily
  namespace: longhorn-system
spec:
  # daily snapshop and retain weekly
  cron: "0 0 * * *"
  task: "snapshot"
  groups:
  - default
  retain: 6
  concurrency: 2
  labels:
    type: 'snap'
    schedule: 'daily'
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  # weekly backups retain monthly
  cron: "0 6 * * SUN"
  task: "backup"
  groups:
  - default
  retain: 4
  concurrency: 2
  labels:
    type: 'full'
    schedule: 'weekly'
